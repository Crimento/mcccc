# Example HTTP virtual host. Replace server_name with your domain.
# Install in a directory included by nginx's http {} block, e.g.
# /etc/nginx/conf.d/mcccc.conf, then run: nginx -t
server {
    listen 80;
    listen [::]:80;
    server_name mccc.example.com;

    # Assumes /home/website/mcccc is the repository, built with npm run build.
    # If you copy the CONTENTS of dist/ directly into /home/website/mcccc,
    # use that directory as root instead (without /dist).
    root /home/website/mcccc/dist;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Revalidate HTML so new deployments load the current asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's generated asset names contain content hashes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Menu routes use #/settings/... and are handled entirely in the browser.
    location / {
        try_files $uri $uri/ =404;
    }
}
